<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14110d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="fonts/fonts.css">
<title>Gym Log</title>
<style>
:root{--ink:#17130f;--cream:#fff6e6;--bg:#14110d;--t0:#5c3d06;--t1:#a8700c;--t2:#f2b33d;--t3:#f7cd73;--t4:#fbe5b0;--hl:#ff2e63}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--cream);font:16px/1.35 'Inter Tight',system-ui,sans-serif}
.mono{font-family:'DM Mono',ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;font-size:11px}
.ar{font-family:Cairo,sans-serif;font-weight:900;direction:rtl}
#app{max-width:520px;margin:0 auto;padding:0 0 130px}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
.hud{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 6px}
.ticks{display:flex;gap:3px;align-items:flex-end;padding:0 16px;height:16px}
.ticks i{flex:1;height:5px;border-radius:2px;background:color-mix(in srgb,var(--cream) 22%,transparent)}
.ticks i.done{background:color-mix(in srgb,var(--t2) 55%,transparent)}.ticks i.cur{height:14px;background:var(--t2)}
.ticks i.A{--c:#f2b33d}.ticks i.B{--c:#2fb5d9}
.hero{position:relative;margin:10px 12px;border-radius:22px;overflow:hidden;background:var(--t2);color:var(--ink);min-height:430px}
.pat{position:absolute;inset:0;width:100%;height:100%}
.hero .in{position:relative;padding:16px 18px 18px}
.big{font-weight:900;font-size:120px;line-height:.82;letter-spacing:-.04em}
.title{font-weight:900;font-size:34px;line-height:.95;letter-spacing:-.02em;text-transform:uppercase}
.stage{position:relative;width:100%;aspect-ratio:1/1}
.stage svg{width:100%;height:100%;display:block}
.cta{display:block;width:100%;background:var(--ink);color:var(--t3);font-weight:900;font-size:22px;letter-spacing:.04em;border-radius:14px;padding:16px;margin-top:12px;text-transform:uppercase}
.cta.alt{background:transparent;border:3px solid var(--ink);color:var(--ink)}
.sec{padding:22px 16px 6px}
.days{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:0 12px}
.dayt{position:relative;overflow:hidden;border-radius:16px;color:var(--ink);text-align:left;padding:10px;min-height:118px}
.dayt .pat{opacity:.9}.dayt>*{position:relative}
.dayt b{display:block;font-weight:900;font-size:40px;line-height:.9;letter-spacing:-.03em}
.dayt .n{font-weight:800;font-size:13px;line-height:1.05;text-transform:uppercase}
.dayt.next{outline:3px solid var(--cream);outline-offset:2px}
.wall{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 12px}
.wall div{border-radius:12px;overflow:hidden;background:var(--t3)}
.wall svg{display:block;width:100%}
.wall span{display:block;font-size:10px;padding:0 6px 6px;color:var(--ink);font-weight:800;text-transform:uppercase;line-height:1.1;min-height:28px}
.card{margin:8px 12px;border-radius:16px;background:#221d17;padding:14px}
.hist summary{list-style:none;display:flex;justify-content:space-between;gap:8px;cursor:pointer}
.hist table{width:100%;font-size:13px;margin-top:8px;border-collapse:collapse}.hist td{padding:4px 0;border-top:1px solid #3a322a}
/* workout */
.wtop{position:sticky;top:0;z-index:5;background:var(--bg);padding-bottom:6px}
.wtop .hud b{font-weight:900;font-size:15px;text-transform:uppercase}
.back{width:40px;height:40px;border-radius:12px;background:#2a241d;font-size:22px;font-weight:900}
.clock{color:var(--t2);font-weight:900;font-variant-numeric:tabular-nums}
.ex{margin:8px 12px;border-radius:22px;overflow:hidden;background:var(--t2);color:var(--ink);position:relative}
.ex .stage{background:transparent}
.ex .meta{position:absolute;left:14px;right:14px;top:12px;display:flex;justify-content:space-between;z-index:2}
.chip{background:var(--ink);color:var(--t3);border-radius:20px;padding:4px 10px}
.ex .body{position:relative;padding:4px 16px 16px;background:var(--t2)}
.ex .ar{font-size:20px;line-height:1.3;color:var(--t0)}
.last{font-size:13px;font-weight:700;color:var(--t0);margin-top:6px}
.hint{display:inline-block;margin-top:6px;background:var(--ink);color:#7dffa6;border-radius:8px;padding:4px 8px;font-size:12px;font-weight:800}
.ww{display:flex;align-items:center;gap:8px;margin:12px 0 4px}
.ww .lbl{flex:1;font-weight:900;text-transform:uppercase;font-size:13px;line-height:1.1}
.step{width:50px;height:50px;border-radius:14px;background:var(--ink);color:var(--t3);font-size:28px;font-weight:900}
input{font:inherit;font-weight:900;font-size:22px;background:var(--t4);color:var(--ink);border:0;border-radius:12px;height:50px;padding:0 6px;width:100%;text-align:center}
input::placeholder{color:color-mix(in srgb,var(--ink) 35%,transparent);font-weight:700;font-size:16px}
input:focus{outline:3px solid var(--ink)}
.ww input{width:92px}
.set{display:grid;grid-template-columns:62px 1fr 14px 1fr 54px;gap:6px;align-items:center;margin-top:7px}
.tag{font-weight:900;font-size:13px;text-align:center;line-height:1;padding:9px 0;border-radius:10px;background:var(--t3)}
.tag.heavy{background:var(--ink);color:var(--t2)}.tag.light{background:var(--t1);color:var(--t4)}.tag.fail{background:var(--hl);color:#fff}
.x{text-align:center;font-weight:900;opacity:.5}
.chk{height:50px;border-radius:12px;background:var(--t3);font-size:24px;font-weight:900;color:var(--t0)}
.set.done .chk{background:var(--ink);color:#7dffa6}.set.done input{background:color-mix(in srgb,var(--t4) 55%,var(--t2))}
.ex.complete .chip.st{background:#1d7a3e;color:#fff}
.dots{display:flex;gap:5px;margin:14px 0 8px}.dot{flex:1;border-radius:10px;padding:8px 0;font-weight:900;font-size:12px;background:var(--t3);color:var(--t0)}
.dot.done{background:var(--ink);color:#7dffa6}.dot.cur{outline:3px solid var(--ink);outline-offset:1px}
.one{background:var(--t3);border-radius:18px;padding:14px}.one.done{background:color-mix(in srgb,#7dffa6 35%,var(--t3))}
.onehd{display:flex;align-items:center;gap:10px}.onehd b{flex:1;font-weight:900;font-size:22px}.onehd .tag{padding:9px 10px}
.lab{font-weight:900;font-size:12px;text-transform:uppercase;margin-top:12px;color:var(--t0)}
.one .ww{margin:4px 0}.one .ww input{flex:1;width:auto;min-width:0;height:64px;font-size:34px}.one .step{width:64px;height:64px;font-size:34px}
.nav{display:flex;gap:8px;margin:10px 12px}
.nav button{flex:1;border-radius:14px;padding:15px;font-weight:900;font-size:17px;text-transform:uppercase;background:#2a241d}
.nav .go{background:var(--t2);color:var(--ink);flex:2}
#timer{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--ink) 94%,transparent);display:none;flex-direction:column;justify-content:center;padding:24px}#timer.on{display:flex}#timer .in{flex-direction:column;align-items:stretch!important}#timer .tl{text-align:center}#timer .tv{font-size:120px!important;margin:10px 0 20px}#timer .in>button{padding:18px!important;font-size:20px}#timer .bar{width:100%}
#timer .in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:8px}
#timer .tl{flex:1}#timer .tv{font-size:46px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;color:var(--t2)}
#timer button{background:#2a241d;border-radius:12px;padding:12px 12px;font-weight:900}
#timer .sk{background:var(--t2);color:var(--ink)}
#timer .bar{height:5px;background:#2a241d;border-radius:4px;overflow:hidden;max-width:520px;margin:10px auto 0}#timer .bar i{display:block;height:100%;background:var(--t2)}
#timer.ring{background:var(--t2)}#timer.ring .tv,#timer.ring .mono{color:var(--ink)}
.row{display:flex;gap:8px}.row>*{flex:1}
.set-in label{font-size:12px;font-weight:800;color:#b9ad9c}
.set-in input{background:#2f2820;color:var(--cream);font-size:18px;height:44px}
.sm{background:#2f2820;border-radius:12px;padding:10px;font-weight:800;font-size:14px}
.sum{text-align:center;padding:20px}.sum .big{font-size:84px}
</style>
</head>
<body>
<div id="app"></div>
<div id="timer"><div class="in"><div class="tl"><div class="mono" id="tlab">Rest</div><div class="tv" id="tval">0:00</div></div>
<button data-t="-15">−15</button><button data-t="15">+15</button><button class="sk" data-t="x">SKIP REST</button></div><div class="bar"><i id="tbar"></i></div></div>
<script>window.onerror=(m,u,l)=>{const d=document.createElement('div');d.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:99;background:#c00;color:#fff;padding:10px;font:12px monospace';d.textContent='Error: '+m+' (line '+l+')';document.body.append(d)}</script>
<script src="picto.js"></script>
<script>
// ---------- Program ----------
const F='F';
const AR={'Butterfly':'فراشة','Incline dumbbell bench press':'بنش عالي دمبل','Flat dumbbell bench press':'بنش مستوي دمبل','EZ handle push-down':'ترايسبس بوش داون بالبار','Triceps dips machine':'جهاز ديبس ترايسبس',
'Lat pull-down':'سحب أمامي','Seated rows machine':'سحب أرضي جهاز','Chest-supported barbell row':'تجديف بالبار مع سند الصدر','Back hyperextension (free weight)':'ظهر سفلي هايبر','Incline bench dumbbell curl':'بايسبس دمبل على بنش مائل','Dumbbell preacher curl':'بايسبس ارتكاز دمبل',
'Leg extension':'رفرفة أمامي','Leg curl':'رفرفة خلفي','Leg press':'دفع رجلين','Hack squat':'هاك سكوات','Standing calf raise':'سمانة واقف',
'Incline barbell press':'بنش عالي بالبار','Flat barbell press':'بنش مستوي بالبار','Rope push-down':'ترايسبس بالحبل','Overhead cable triceps extension':'ترايسبس خلف الرأس بالكابل',
'Neutral-grip lat pull-down (shoulder width)':'سحب أمامي قبضة متوازية','One-arm dumbbell row':'سحب دمبل بذراع واحدة','Chest-supported barbell row (close grip)':'تجديف بالبار قبضة ضيقة','Dumbbell hammer curl':'بايسبس هامر دمبل','Dumbbell concentration curl':'بايسبس تركيز دمبل',
'Lateral dumbbell raise':'رفرفة جانبي دمبل','Shoulder press machine':'ضغط أكتاف جهاز','Reverse butterfly (rear delts)':'فراشة عكسي – كتف خلفي','Dumbbell shrugs':'ترابيس دمبل','Seated calf machine':'سمانة جالس'};
const MUS={chest:'Chest',triceps:'Triceps',biceps:'Biceps',back:'Mid back',lats:'Lats',lowback:'Lower back',quads:'Quads',hams:'Hamstrings',calves:'Calves',shoulders:'Side delts',rear:'Rear delts',traps:'Traps'};
const DAYS={
A1:{t:'Chest & Triceps',ar:'صدر وترايسبس',g:[['Chest',[['Butterfly',2],['Incline dumbbell bench press',0],['Flat dumbbell bench press',0]]],['Triceps',[['EZ handle push-down',0],['Triceps dips machine',0]]]]},
A2:{t:'Back & Biceps',ar:'ظهر وبايسبس',g:[['Back',[['Lat pull-down',2],['Seated rows machine',0],['Chest-supported barbell row',0],['Back hyperextension (free weight)',F]]],['Biceps',[['Incline bench dumbbell curl',0],['Dumbbell preacher curl',0]]]]},
A3:{t:'Legs',ar:'رجل',g:[['Legs',[['Leg extension',2],['Leg curl',2],['Leg press',0],['Hack squat',0],['Standing calf raise',0]]]]},
B1:{t:'Chest & Triceps',ar:'صدر وترايسبس',g:[['Chest',[['Butterfly',2],['Incline barbell press',0],['Flat barbell press',0]]],['Triceps',[['Rope push-down',0],['Overhead cable triceps extension',0]]]]},
B2:{t:'Back & Biceps',ar:'ظهر وبايسبس',g:[['Back',[['Neutral-grip lat pull-down (shoulder width)',2],['One-arm dumbbell row',0],['Chest-supported barbell row (close grip)',0],['Back hyperextension (free weight)',F]]],['Biceps',[['Dumbbell hammer curl',0],['Dumbbell concentration curl',0]]]]},
B3:{t:'Shoulders & Calves',ar:'أكتاف وسمانة',g:[['Shoulders',[['Lateral dumbbell raise',2],['Shoulder press machine',2],['Reverse butterfly (rear delts)',1],['Dumbbell shrugs',0]]],['Calves',[['Seated calf machine',2]]]]}
};
// five tones per day hue (dark → light) — warm family = A, cool family = B
const HUE={A1:['#5c3d06','#a8700c','#f2b33d','#f7cd73','#fbe5b0'],A2:['#5a2300','#a8480e','#f07a2e','#f6a46b','#fbd0ad'],A3:['#5a1410','#a3271e','#e2483a','#ee7f74','#f7b8b0'],
B1:['#053c4d','#0b7391','#2fb5d9','#78d2ea','#bfeaf6'],B2:['#06413a','#0e7a6c','#22b39e','#6fd3c3','#b6ece3'],B3:['#0d2a5c','#1d4fa3','#3d7fe0','#7ea9ee','#bcd3f7']};
const pal=id=>{const h=HUE[id];return{0:h[0],1:h[1],2:h[2],3:h[3],4:h[4],k:'#17130f',far:`color-mix(in srgb,#17130f 58%,${h[2]})`,hl:'#ff2e63'}};
const ORDER=['A1','A2','A3','B1','B2','B3'],CYCLE=['A1','A2','A3','R','R','B1','B2','B3','R','R'];
const key=n=>n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const setsFor=w=>w===F?['fail','fail','fail']:[...Array(w).fill('warm'),'light','heavy','heavy'];
const LBL={warm:'WARM',light:'70%',heavy:'100%',fail:'FAIL'},TGT={warm:'15',light:'8–12',heavy:'8–12',fail:'max'};
const exList=id=>DAYS[id].g.flatMap(([grp,xs])=>xs.map(([n,w])=>({grp,n,k:key(n),sets:setsFor(w)})));
function setTheme(id){const h=HUE[id],r=document.documentElement.style;['t0','t1','t2','t3','t4'].forEach((v,i)=>r.setProperty('--'+v,h[i]))}

// ---------- pattern grid (discs, half-discs, motif cells in five tones) ----------
function rng(s){return()=>(s=(s*16807)%2147483647)/2147483647}
function pattern(id,cols,rows,seed,low){
  const h=HUE[id],r=rng(seed||7),c=20;let s='';
  const tone=()=>low?[h[2],h[3],h[2],h[1]][Math.floor(r()*4)]:h[Math.floor(r()*5)];
  for(let y=0;y<rows;y++){let row='';for(let x=-1;x<=cols;x++){const X=x*c,Y=y*c,k=r(),col=tone();
    if(k<.18)row+=`<circle cx="${X+c/2}" cy="${Y+c/2}" r="${c/2}" fill="${col}"/>`;
    else if(k<.32)row+=`<path d="M${X} ${Y+c}A${c/2} ${c/2} 0 0 1 ${X+c} ${Y+c}Z" fill="${col}"/>`;
    else if(k<.44)row+=`<path d="M${X} ${Y}L${X+c} ${Y}A${c} ${c} 0 0 1 ${X} ${Y+c}Z" fill="${col}"/>`;
    else if(k<.54)row+=`<circle cx="${X+c/2}" cy="${Y+c/2}" r="${c/2-1}" fill="none" stroke="${col}" stroke-width="3"/><circle cx="${X+c/2}" cy="${Y+c/2}" r="3" fill="${col}"/>`;
    else if(k<.62)row+=[0,1,2].map(i=>`<circle cx="${X+4+i*6}" cy="${Y+c/2}" r="2" fill="${col}"/>`).join('');
    else if(k<.7)row+=`<rect x="${X}" y="${Y}" width="${c/2}" height="${c/2}" fill="${col}"/><rect x="${X+c/2}" y="${Y+c/2}" width="${c/2}" height="${c/2}" fill="${col}"/>`;}
    s+=`<g class="prow" style="animation-duration:${18+y%3*6}s;animation-direction:${y%2?'reverse':'normal'}">${row}</g>`}
  return`<svg class="pat" viewBox="0 0 ${cols*c} ${rows*c}" preserveAspectRatio="xMidYMid slice"><rect width="100%" height="100%" fill="${h[2]}"/>${s}</svg>`;
}
const css=document.createElement('style');css.textContent='@keyframes drift{from{transform:translateX(0)}to{transform:translateX(20px)}}.prow{animation:drift linear infinite alternate}';document.head.append(css);

// stage = sun disc + pictogram (animated by the loop)
function stage(k,id,still,sz){const t=pal(id);return`<div class="stage" ${still?'':`data-anim="${k}" data-day="${id}"`}><svg viewBox="0 0 200 200"><circle cx="100" cy="105" r="80" fill="${t[3]}"/><circle cx="100" cy="105" r="80" fill="url(#sw)" opacity=".0"/><g class="fig">${Picto.draw(k,t,0,{still:!!still,nohl:false})}</g></svg></div>`}
let anims=[],t0=performance.now(),lastF=0;
function loop(now){
  requestAnimationFrame(loop);if(now-lastF<33)return;lastF=now;
  for(const el of anims){if(!el.isConnected)continue;const k=el.dataset.anim,per=Picto.period(k)*1000,ph=((now-t0)%per)/per;el.querySelector('.fig').innerHTML=Picto.draw(k,pal(el.dataset.day),ph)}
}
function collectAnims(){anims=[...document.querySelectorAll('[data-anim]')]}
requestAnimationFrame(loop);

// ---------- Store ----------
const SK='gymlog.v1';
let S=(()=>{try{return JSON.parse(localStorage.getItem(SK))||{}}catch(e){return{}}})();
S.work??={};S.history??=[];S.active??=null;S.settings={rest:90,warm:60,round:2.5,...(S.settings||{})};
const save=()=>localStorage.setItem(SK,JSON.stringify(S));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dBetween=(a,b)=>Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5);
const fmtD=s=>new Date(s+'T12:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
const pct=w=>{const r=+S.settings.round||2.5;return w?Math.round(w*0.7/r)*r:''};
const num=v=>v===''||v==null||isNaN(+v)?'':+v;
const lastFor=k=>{for(let i=S.history.length-1;i>=0;i--){const e=S.history[i].ex[k];if(e&&e.sets.some(s=>s.done))return{e,date:S.history[i].date}}return null};
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad2=n=>String(n).padStart(2,'0');

function nextUp(){
  const h=S.history;if(!h.length)return{id:'A1',msg:'First session · Workout A'};
  const L=h[h.length-1],id=ORDER[(ORDER.indexOf(L.day)+1)%6],gap=dBetween(L.date,today());
  if(gap<=0)return{id,done:true,msg:`Done today (${L.day}) · next ${id}`};
  if((L.day==='A3'||L.day==='B3')&&gap<3)return{id,rest:gap,msg:`Rest day ${gap} of 2 · next ${id}`};
  return{id,msg:'Up next'};
}
function cyclePos(n){const L=S.history[S.history.length-1];if(!L)return 0;if(n.done)return CYCLE.indexOf(L.day);if(n.rest)return CYCLE.indexOf(L.day)+n.rest;return CYCLE.indexOf(n.id)}

// ---------- Home ----------
function home(){
  if(S.active)return resumeCard();
  const n=nextUp(),pos=cyclePos(n),id=n.id,D=DAYS[id],xs=exList(id);setTheme(id);
  const lastDate=d=>{for(let i=S.history.length-1;i>=0;i--)if(S.history[i].day===d)return fmtD(S.history[i].date);return'—'};
  app.innerHTML=`
  <div class="hud"><span class="mono">Gym Log // ${fmtD(today())}</span><span class="mono">Cycle ${pad2(pos+1)}/10</span></div>
  <div class="ticks">${CYCLE.map((c,i)=>`<i class="${i<pos?'done':''} ${i===pos?'cur':''}" title="${c}"></i>`).join('')}</div>
  <div class="hero">${pattern(id,10,22,ORDER.indexOf(id)+3)}
   <div class="in">
    <div style="display:flex;justify-content:space-between"><span class="mono chip">${esc(n.msg)}</span><span class="mono chip">Workout ${id[0]}</span></div>
    <div class="stage" data-anim="${key(xs[0].n)}" data-day="${id}" style="margin:6px auto -6px;width:78%"><svg viewBox="0 0 200 200"><circle cx="100" cy="105" r="80" fill="${HUE[id][3]}"/><g class="fig"></g></svg></div>
    <div style="background:var(--t2);border-radius:16px;padding:12px 12px 14px;margin:0 -4px">
     <div class="big">${id}</div>
     <div class="title" style="margin-top:6px">${D.t}</div>
     <div class="ar" style="font-size:22px;color:var(--t0)">${D.ar}</div>
     <div class="mono" style="margin-top:6px;color:var(--t0)">${xs.length} exercises · cardio 15 min @ 3.8 mph</div>
     <button class="cta" data-a="start" data-id="${id}">${n.rest||n.done?'Train anyway':'Start workout'} ▶</button>
    </div></div></div>
  <div class="sec mono">Today's line-up</div>
  <div class="wall">${xs.map(x=>`<div><svg viewBox="0 0 200 200"><circle cx="100" cy="105" r="80" fill="${HUE[id][4]}"/>${Picto.draw(x.k,pal(id),0,{still:1})}</svg><span>${esc(x.n)}</span></div>`).join('')}</div>
  <div class="sec mono">Workout A · 3 days → 2 off</div>
  <div class="days">${ORDER.slice(0,3).map(dayT).join('')}</div>
  <div class="sec mono">Workout B · 3 days → 2 off</div>
  <div class="days">${ORDER.slice(3).map(dayT).join('')}</div>
  <div class="sec mono">History</div>
  ${S.history.length?S.history.slice().reverse().slice(0,20).map(histItem).join(''):'<div class="card mono" style="opacity:.6">No workouts logged yet</div>'}
  <div class="sec mono">Settings</div>
  <div class="card set-in"><div class="row">
   <label>Rest sec<input type="number" inputmode="numeric" data-s="rest" value="${S.settings.rest}"></label>
   <label>Warm-up rest<input type="number" inputmode="numeric" data-s="warm" value="${S.settings.warm}"></label>
   <label>Round 70% to<input type="number" inputmode="decimal" data-s="round" value="${S.settings.round}"></label></div>
   <div class="row" style="margin-top:10px"><button class="sm" data-a="export">Export backup</button><button class="sm" data-a="import">Import backup</button></div></div>`;
  collectAnims();
  function dayT(d){return`<button class="dayt ${d===id?'next':''}" data-a="start" data-id="${d}">${pattern(d,4,6,ORDER.indexOf(d)+11,true)}<b>${d}</b><div class="n">${DAYS[d].t}</div><div class="ar" style="font-size:12px">${DAYS[d].ar}</div><div class="mono" style="font-size:9px;margin-top:4px">${lastDate(d)}</div></button>`}
}
function resumeCard(){
  const a=S.active;setTheme(a.day);
  app.innerHTML=`<div class="hud"><span class="mono">Gym Log</span><span class="mono">In progress</span></div>
  <div class="hero" style="min-height:0">${pattern(a.day,10,14,5)}<div class="in"><div style="background:var(--t2);border-radius:16px;padding:14px">
   <div class="big">${a.day}</div><div class="title">${DAYS[a.day].t}</div><div class="ar" style="font-size:22px;color:var(--t0)">${DAYS[a.day].ar}</div>
   <button class="cta" data-a="resume">Resume ▶</button><button class="cta alt" data-a="discard">Discard</button></div></div></div>`;
}
function histItem(h){
  const dur=h.end?Math.round((h.end-h.start)/6e4)+' min':'';
  const rows=exList(h.day).map(x=>{const e=h.ex[x.k];if(!e)return'';const s=e.sets.filter(s=>s.done).map(s=>`${s.w||'BW'}×${s.r||'?'}`).join(', ');return s?`<tr><td>${esc(x.n)}</td><td style="text-align:right">${s}</td></tr>`:''}).join('');
  return`<details class="card hist" style="border-left:6px solid ${HUE[h.day][2]}"><summary><span><b style="color:${HUE[h.day][2]};font-weight:900">${h.day}</b> ${DAYS[h.day].t}</span><span class="mono">${fmtD(h.date)} · ${dur}${h.cardio?' · cardio':''}</span></summary><table>${rows}</table>
  <button class="sm" style="margin-top:8px" data-a="del" data-id="${h.id}">Delete</button></details>`;
}

// ---------- Workout ----------
function start(id){
  if(S.active&&!confirm('Discard the workout in progress?'))return;
  const a={day:id,date:today(),start:Date.now(),cardio:false,cur:0,ex:{}};
  for(const x of exList(id)){
    const W=num(S.work[x.k]),L=lastFor(x.k);
    a.ex[x.k]={work:W,sets:x.sets.map((t,i)=>({t,w:t==='heavy'?W:t==='light'?pct(W):(L&&L.e.sets[i]&&L.e.sets[i].t===t?L.e.sets[i].w:''),r:'',done:false}))};
  }
  S.active=a;save();workout();
}
function workout(){
  const a=S.active,id=a.day,xs=exList(id),N=xs.length+1;setTheme(id);a.cur=Math.min(a.cur||0,N-1);
  const doneIdx=i=>i===0?a.cardio:a.ex[xs[i-1].k].sets.every(s=>s.done);
  const body=a.cur===0?cardioCard(a,N):exCard(xs[a.cur-1],a.ex[xs[a.cur-1].k],a.cur,N,id);
  app.innerHTML=`<div class="wtop"><div class="hud"><button class="back" data-a="home">‹</button><b>${id} · ${DAYS[id].t}</b><span class="clock" id="clock"></span></div>
  <div class="ticks">${Array.from({length:N},(_,i)=>`<i class="${doneIdx(i)?'done':''} ${i===a.cur?'cur':''}" data-a="go" data-i="${i}"></i>`).join('')}</div></div>
  ${body}
  <div class="nav"><button data-a="prev" ${a.cur===0?'style="visibility:hidden"':''}>‹ Prev</button>${a.cur<N-1?`<button class="go" data-a="next">Next ›</button>`:`<button class="go" data-a="finish">Finish ✓</button>`}</div>`;
  tickClock();collectAnims();
}
function cardioCard(a,N){
  return`<div class="ex ${a.cardio?'complete':''}"><div class="meta"><span class="mono chip">01 / ${pad2(N)}</span><span class="mono chip st">${a.cardio?'Done':'Warm-up cardio'}</span></div>
  <div style="position:relative">${pattern(a.day,10,10,21,true)}${stage('treadmill',a.day)}</div><div class="body"><div class="title">Treadmill walk</div><div class="ar">مشي على السير</div>
  <div class="last">15 minutes · 3.8 mph</div>
  <div class="row" style="margin-top:12px"><button class="cta" style="margin:0" data-a="cardioT">15:00 ▶</button><button class="cta ${a.cardio?'':'alt'}" style="margin:0" data-a="cardio">${a.cardio?'Done ✓':'Mark done'}</button></div></div></div>`;
}
function exCard(x,e,i,N,id){
  const L=lastFor(x.k),fail=x.sets[0]==='fail',mus=Picto.X[x.k]?.mus;
  let last='First time — pick a weight you can do for 8–12 reps',hint='';
  if(L){last='Last · '+fmtD(L.date)+' · '+L.e.sets.filter(s=>s.done&&s.t!=='warm').map(s=>`${s.w||'BW'}×${s.r||'?'}`).join('  ');
    const hv=L.e.sets.filter(s=>s.t==='heavy'&&s.done);if(hv.length===2&&hv.every(s=>+s.r>=12))hint='↑ 12+ reps on both 100% sets last time — add weight';}
  const done=e.sets.every(s=>s.done),nd=e.sets.filter(s=>s.done).length;
  return`<div class="ex ${done?'complete':''}" data-k="${x.k}"><div class="meta"><span class="mono chip">${pad2(i+1)} / ${pad2(N)} · ${x.grp}</span><span class="mono chip st">${MUS[mus]||''} · ${nd}/${e.sets.length}</span></div>
  <div style="position:relative">${pattern(id,10,10,i*7+3,true)}${stage(x.k,id)}</div><div class="body"><div class="title" id="xt">${esc(x.n)}</div><div class="ar">${AR[x.n]||''}</div>
  <div class="last">${esc(last)}</div>${hint?`<div class="hint">${hint}</div>`:''}
  ${fail?'<div class="last">3 sets to failure</div>':`<div class="ww"><span class="lbl">100%<br>weight</span><button class="step" data-a="ws" data-d="-1">−</button><input type="number" inputmode="decimal" data-f="work" value="${e.work}" placeholder="kg"><button class="step" data-a="ws" data-d="1">+</button></div><div class="mono" style="color:var(--t0)">70% set = <b data-p>${pct(e.work)||'–'}</b> kg · all work sets 8–12 reps</div>`}
  ${setBlock(e,fail)}</div></div>`;
}
function curSet(e){if(e.cur!=null&&e.sets[e.cur])return e.cur;const j=e.sets.findIndex(s=>!s.done);return j<0?e.sets.length-1:j}
function setBlock(e,fail){
  const j=curSet(e),s=e.sets[j],all=e.sets.every(s=>s.done);
  return`<div class="dots">${e.sets.map((q,i)=>`<button data-a="pick" data-i="${i}" class="dot ${q.t} ${q.done?'done':''} ${i===j?'cur':''}">${q.done?'✓':LBL[q.t]}</button>`).join('')}</div>
  <div class="one ${s.done?'done':''}" data-i="${j}">
   <div class="onehd"><span class="tag ${s.t}">${LBL[s.t]}</span><b>Set ${j+1} of ${e.sets.length}</b><span class="mono">target ${TGT[s.t]} reps</span></div>
   <div class="lab">Weight (kg)</div>
   <div class="ww"><button class="step" data-a="sw" data-d="-1">−</button><input type="number" inputmode="decimal" data-f="w" value="${s.w}" placeholder="${fail?'BW':'kg'}"><button class="step" data-a="sw" data-d="1">+</button></div>
   <div class="lab">Reps</div>
   <div class="ww"><button class="step" data-a="sr" data-d="-1">−</button><input type="number" inputmode="numeric" data-f="r" value="${s.r}" placeholder="${TGT[s.t]}"><button class="step" data-a="sr" data-d="1">+</button></div>
   <button class="cta" data-a="set">${s.done?'Undo set ✓':'Done — start rest'}</button>
   ${all?'<button class="cta alt" data-a="next">Exercise complete · Next ›</button>':''}
  </div>`;
}
function finish(){
  const a=S.active,n=Object.values(a.ex).flatMap(e=>e.sets).filter(s=>s.done);
  if(!n.length&&!confirm('No sets ticked. Finish anyway?'))return;
  if(!confirm('Finish and save this workout?'))return;
  a.end=Date.now();a.id=a.start;
  for(const[k,e]of Object.entries(a.ex)){const hv=e.sets.filter(s=>s.t==='heavy'&&s.done&&num(s.w)!=='');if(hv.length)S.work[k]=Math.max(...hv.map(s=>+s.w));else if(num(e.work)!=='')S.work[k]=+e.work}
  S.history.push(a);S.active=null;save();stopTimer();releaseWake();
  const vol=n.reduce((t,s)=>t+(+s.w||0)*(+s.r||0),0),min=Math.round((a.end-a.start)/6e4);
  app.innerHTML=`<div class="hero" style="min-height:0">${pattern(a.day,10,20,9)}<div class="in"><div style="background:var(--t2);border-radius:16px;padding:16px" class="sum">
   <div class="mono">${a.day} · ${DAYS[a.day].t} · done</div><div class="big" id="vol">0</div><div class="title">kg lifted</div>
   <div class="row mono" style="margin-top:12px"><span>${n.length} sets</span><span>${min} min</span><span>${a.cardio?'cardio ✓':'no cardio'}</span></div>
   <div class="wall" style="padding:12px 0 0">${exList(a.day).map(x=>`<div style="background:var(--t3)"><svg viewBox="0 0 200 200">${Picto.draw(x.k,{...pal(a.day),k:'#17130f'},0,{still:1,nohl:!a.ex[x.k].sets.every(s=>s.done)})}</svg></div>`).join('')}</div>
   <button class="cta" data-a="home">Done</button></div></div></div>`;
  let v=0;const st=performance.now();(function up(t){const k=Math.min(1,(t-st)/900);$('#vol')&&($('#vol').textContent=Math.round(vol*(1-Math.pow(1-k,3))).toLocaleString());if(k<1)requestAnimationFrame(up)})(st);
  window.scrollTo(0,0);
}

// ---------- Events ----------
app.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-a]');if(!b)return;unlockAudio();
  const A=b.dataset.a,card=b.closest('.ex'),a=S.active;
  const go=i=>{a.cur=i;save();workout();window.scrollTo(0,0)};
  if(A==='start'){start(b.dataset.id);window.scrollTo(0,0);wake()}
  else if(A==='resume'){workout();wake()}
  else if(A==='discard'){if(confirm('Discard workout in progress?')){S.active=null;save();home()}}
  else if(A==='home'){home();window.scrollTo(0,0)}
  else if(A==='finish')finish();
  else if(A==='next')go(a.cur+1);else if(A==='prev')go(a.cur-1);else if(A==='go')go(+b.dataset.i);
  else if(A==='cardio'){a.cardio=!a.cardio;save();workout()}
  else if(A==='cardioT')document.activeElement?.blur(),startTimer(15*60,'Cardio · 3.8 mph');
  else if(A==='del'){if(confirm('Delete this workout from history?')){S.history=S.history.filter(h=>String(h.id)!==b.dataset.id);save();home()}}
  else if(A==='export'){const u=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));const l=document.createElement('a');l.href=u;l.download='gymlog-'+today()+'.json';l.click()}
  else if(A==='import'){const f=document.createElement('input');f.type='file';f.accept='.json,application/json';f.onchange=()=>f.files[0].text().then(t=>{const d=JSON.parse(t);if(d.history&&confirm('Replace current data with this backup?')){S=d;save();home()}});f.click()}
  else if(A==='ws'){const e=a.ex[card.dataset.k],st=+S.settings.round||2.5;e.work=Math.max(0,(num(e.work)||0)+st*+b.dataset.d);applyWork(card,e);save()}
  else if(A==='pick'){const e=a.ex[card.dataset.k];e.cur=+b.dataset.i;save();workout()}
  else if(A==='sw'||A==='sr'){const e=a.ex[card.dataset.k],s=e.sets[curSet(e)],f=A==='sw'?'w':'r',st=A==='sw'?(+S.settings.round||2.5):1;
    let v=num(s[f]);if(v===''&&f==='r')v=s.t==='warm'?15:(+b.dataset.d>0?7:13);else if(v==='')v=0;s[f]=Math.max(0,v+st*+b.dataset.d);card.querySelector(`.one [data-f=${f}]`).value=s[f];save()}
  else if(A==='set'){const e=a.ex[card.dataset.k],j=curSet(e),s=e.sets[j];
    s.done=!s.done;if(s.done&&s.r==='')s.r=s.t==='warm'?15:s.r;
    if(s.done){const nx=e.sets.findIndex(q=>!q.done);e.cur=nx<0?j:nx}else e.cur=j;save();
    if(s.done){document.activeElement?.blur();navigator.vibrate?.(30);const all=e.sets.every(q=>q.done);startTimer(s.t==='warm'?+S.settings.warm:+S.settings.rest,all?'Exercise done · rest, then next':'Rest · next: set '+(e.cur+1))}
    workout()}
});
app.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.dataset.s){S.settings[t.dataset.s]=+t.value||S.settings[t.dataset.s];save();return}
  const card=t.closest('.ex');if(!card||!S.active||!card.dataset.k)return;const e=S.active.ex[card.dataset.k];
  if(t.dataset.f==='work'){e.work=num(t.value);applyWork(card,e,true)}
  else{const s=e.sets[+t.closest('.one').dataset.i];s[t.dataset.f]=num(t.value)}
  save();
});
app.addEventListener('focusin',e=>{if(e.target.tagName==='INPUT')e.target.select()});
function applyWork(card,e,typing){
  if(!typing)card.querySelector('[data-f=work]').value=e.work;
  card.querySelector('[data-p]').textContent=pct(e.work)||'–';
  e.sets.forEach((s,i)=>{if(s.done)return;if(s.t==='heavy')s.w=e.work;else if(s.t==='light')s.w=pct(e.work);else return;const o=card.querySelector('.one');if(o&&+o.dataset.i===i)o.querySelector('[data-f=w]').value=s.w});
}
// swipe between exercises
let sx=null,sy=0;app.addEventListener('touchstart',e=>{if(!S.active||e.target.closest('input,button'))return sx=null;sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
app.addEventListener('touchend',e=>{if(sx==null||!S.active)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5){const N=exList(S.active.day).length+1,i=S.active.cur+(dx<0?1:-1);if(i>=0&&i<N){S.active.cur=i;save();workout();window.scrollTo(0,0)}}sx=null});

// ---------- Timer / clock / wake ----------
let T={end:0,tot:0,iv:0},actx;
function unlockAudio(){try{actx??=new (window.AudioContext||window.webkitAudioContext)();actx.resume()}catch(e){}}
function beep(){try{[0,.25,.5].forEach(d=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.4,actx.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d+.2);o.start(actx.currentTime+d);o.stop(actx.currentTime+d+.22)})}catch(e){}}
function startTimer(sec,lab){T.end=Date.now()+sec*1e3;T.tot=sec;$('#tlab').textContent=lab;$('#timer').classList.add('on');$('#timer').classList.remove('ring');clearInterval(T.iv);T.iv=setInterval(tick,250);tick()}
function stopTimer(){clearInterval(T.iv);$('#timer').classList.remove('on')}
function tick(){
  const left=Math.max(0,Math.ceil((T.end-Date.now())/1e3));
  $('#tval').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');$('#tbar').style.width=(100*left/T.tot)+'%';
  if(left<=0){clearInterval(T.iv);$('#tval').textContent='GO!';$('#timer').classList.add('ring');navigator.vibrate?.([300,150,300,150,300]);beep();setTimeout(()=>{if(Date.now()>=T.end)stopTimer()},6000)}
}
document.querySelector('#timer').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b)return;if(b.dataset.t==='x')return stopTimer();T.end+=b.dataset.t*1e3;T.tot=Math.max(T.tot,(T.end-Date.now())/1e3);tick()});
function tickClock(){const c=$('#clock');if(!c||!S.active)return;const m=Math.floor((Date.now()-S.active.start)/6e4);c.textContent=Math.floor(m/60)+':'+String(m%60).padStart(2,'0')}
setInterval(tickClock,15e3);
let lock=null;
async function wake(){try{lock=await navigator.wakeLock?.request('screen')}catch(e){}}
function releaseWake(){lock?.release();lock=null}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(S.active)wake();if(T.end&&$('#timer').classList.contains('on'))tick()}});

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
S.active?workout():home();
</script>
</body>
</html>
